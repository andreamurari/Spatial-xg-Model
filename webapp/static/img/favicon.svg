<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff6b57"/>
      <stop offset="100%" stop-color="#e6293a"/>
    </radialGradient>
    <linearGradient id="arc" x1="8" y1="52" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background (full bleed, no rounding: browsers/OS apply their own icon masking) -->
  <rect x="0" y="0" width="64" height="64" fill="#0a0a0a"/>
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#3a2224" stroke-width="1.5"/>

  <!-- shot trajectory -->
  <path d="M9,52 Q28,52 45,17" fill="none" stroke="url(#arc)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- ball with glow -->
  <circle cx="46" cy="16" r="10.5" fill="#e6293a" opacity="0.5" filter="url(#glow)"/>
  <circle cx="46" cy="16" r="9" fill="url(#ball)"/>
</svg>
